<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HAYDAY · 업무관리 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --blue:#1b63f5; --blue-soft:#eef3ff;
  --green:#23a18f; --green-soft:#e4f7f4;
  --red:#ff5a5a;   --red-soft:#ffecec;
  --amber:#f5a623; --amber-soft:#fff6e6;
  --violet:#a78bfa;--violet-soft:#f2ecff;
  --pink:#f4568c;
  --r-card:18px; --r-ctl:11px; --r-chip:8px;
}
html[data-theme="light"]{
  --txt:#111418; --txt2:#5b636e; --muted:#a5adb8;
  --page:#f0f2f5; --card:#ffffff; --inset:#f6f7f9; --line:#edeff3;
  --sb:#0b0e14; --sbtxt:#ffffff; --sbmuted:#7c8797; --sbline:#1b2130; --sbcard:#151b26;
  --dark-panel:#0b0e14; --dark-panel-txt:#ffffff; --dark-panel-sub:#8b95a5; --dark-panel-card:#161d29;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.05);
}
html[data-theme="dark"]{
  --txt:#eef2f8; --txt2:#98a3b3; --muted:#6b7688;
  --page:#101827; --card:#151a21; --inset:#1b2230; --line:#232b39;
  --sb:#05070a; --sbtxt:#ffffff; --sbmuted:#7c8797; --sbline:#161c28; --sbcard:#111722;
  --dark-panel:#0b1017; --dark-panel-txt:#ffffff; --dark-panel-sub:#8b95a5; --dark-panel-card:#161d29;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Malgun Gothic",sans-serif;
  background:var(--page); color:var(--txt); -webkit-font-smoothing:antialiased;
  letter-spacing:-.01em; font-size:14px;
}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}

/* ---------- shell ---------- */
.app{display:flex;min-height:100vh}
.sb{width:264px;flex:0 0 264px;background:var(--sb);color:var(--sbtxt);padding:26px 0 22px;
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.sb .brand{padding:0 26px 22px;display:flex;align-items:center;gap:9px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--blue)}
.brand h1{font-size:19px;font-weight:800;letter-spacing:.02em}
.brand p{font-size:10.5px;color:var(--sbmuted);margin-top:2px;letter-spacing:.04em}
.me{margin:0 20px 22px;background:var(--sbcard);border-radius:16px;padding:16px 16px 14px}
.me .row{display:flex;align-items:center;gap:11px}
.me .av{width:38px;height:38px;border-radius:50%;background:var(--blue);flex:0 0 38px}
.me .nm{font-size:14px;font-weight:700}
.me .rl{font-size:10.5px;color:var(--sbmuted);margin-top:2px}
.me .sw{margin-left:auto;font-size:10.5px;color:#fff;background:rgba(255,255,255,.14);
  border-radius:8px;padding:5px 10px;align-self:flex-start}
.me .demo{margin-top:12px;background:rgba(245,166,35,.16);color:#f5a623;border-radius:9px;
  padding:8px 11px;font-size:10.5px;font-weight:600}
.me .stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.me .st{background:rgba(255,255,255,.05);border-radius:11px;padding:9px 11px}
.me .st b{font-size:17px;font-weight:800;display:block}
.me .st span{font-size:10px;color:var(--sbmuted)}
.nav{padding:0 20px;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:11px;
       font-size:13.5px;color:#c7cedb;transition:.15s}
.nav a .ic{width:15px;height:15px;border-radius:5px;background:#39424f;flex:0 0 15px}
.nav a:hover{background:rgba(255,255,255,.05);color:#fff}
.nav a.on{background:var(--blue);color:#fff;font-weight:600}
.nav a.on .ic{background:#fff}
.sb hr{border:0;border-top:1px solid var(--sbline);margin:20px 24px}
.team{padding:0 24px}
.team .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.team .hd b{font-size:11.5px;color:var(--sbmuted);font-weight:600}
.team .hd i{font-size:11px;color:var(--blue);font-style:normal;font-weight:700}
.mem{display:flex;align-items:center;gap:11px;padding:7px 0}
.mem .av{width:26px;height:26px;border-radius:50%;flex:0 0 26px;position:relative}
.mem .av.ai::after{content:"AI";position:absolute;right:-4px;bottom:-3px;font-size:6.5px;font-weight:800;
   background:#fff;color:#0b0e14;border-radius:4px;padding:1px 2.5px;line-height:1}
.mem .nm{font-size:12.5px;font-weight:600}
.mem .rl{font-size:10px;color:var(--sbmuted);margin-top:1px}
.mem .cnt{margin-left:auto;font-size:10.5px;color:var(--sbmuted);background:rgba(255,255,255,.06);
          border-radius:6px;padding:2px 7px}
.qlk{padding:0 24px;flex:1}
.qlk .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.qlk .hd b{font-size:11.5px;color:var(--sbmuted);font-weight:600}
.qlk .hd i{font-size:11px;color:var(--blue);font-style:normal;font-weight:700}
.qlk .gp{font-size:9.5px;color:var(--sbmuted);letter-spacing:.04em;margin:9px 0 4px;font-weight:700}
.qlk a{display:flex;align-items:center;gap:9px;padding:6px 8px;margin:0 -8px;border-radius:9px;
       font-size:12px;font-weight:600;color:#e9edf5;transition:background .12s}
.qlk a:hover{background:rgba(255,255,255,.07)}
.qlk a .sq{width:20px;height:20px;border-radius:6px;flex:0 0 20px;display:flex;align-items:center;
       justify-content:center;font-size:9.5px;font-weight:800;color:#fff;letter-spacing:-.02em}
.qlk a .ex{margin-left:auto;font-size:10px;color:var(--sbmuted);opacity:0;transition:opacity .12s}
.qlk a:hover .ex{opacity:1}
.qlk a .lo{margin-left:auto;font-size:9px;color:var(--sbmuted);border:1px solid var(--sbline);
       border-radius:5px;padding:1px 4px}
.lnkrow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.lnkrow a{display:inline-flex;align-items:center;gap:7px;background:var(--inset);border-radius:10px;
       padding:8px 13px;font-size:12px;font-weight:600;color:var(--txt);border:1px solid transparent;
       transition:border-color .12s,transform .12s}
.lnkrow a:hover{border-color:var(--blue);transform:translateY(-1px)}
.lnkrow a .sq{width:18px;height:18px;border-radius:5px;display:flex;align-items:center;
       justify-content:center;font-size:9px;font-weight:800;color:#fff}
.lnkrow a small{color:var(--muted);font-weight:500;font-size:11px}

/* ── 3축 카드 ── */
.trks{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}
.trk{background:var(--card);border-radius:16px;padding:18px 20px;cursor:pointer;
     border:1px solid var(--line);border-top:3px solid var(--tc);transition:transform .12s,box-shadow .12s}
.trk:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(15,23,42,.08)}
.trk .th{display:flex;align-items:center;gap:8px}
.trk .th b{font-size:14px}
.trk p{font-size:11px;color:var(--muted);margin:4px 0 12px}
.trk .tbar{height:6px;border-radius:99px;background:var(--inset);overflow:hidden}
.trk .tbar i{display:block;height:100%;background:var(--tc);border-radius:99px}
.trk .tm2{display:flex;gap:14px;margin-top:10px;font-size:11.5px;color:var(--muted)}
.trk .tm2 b{color:var(--txt);font-size:13px}
.trk .tm2 .rd b,.trk .tm2 .rd{color:var(--red)}
.trk .tn2{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.trk .tn2 b{color:var(--txt)}
.tdot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:2px}
.ug{display:inline-block;font-size:9.5px;font-weight:800;color:#fff;background:var(--red);
    border-radius:5px;padding:1px 5px;margin-right:6px;vertical-align:1px}
.tr2.urgent{background:var(--red-soft)}
.tr2.urgent:hover{background:var(--red-soft);filter:brightness(.97)}
.urgbox{border:1px solid var(--red);margin-bottom:20px}
.ubtn{font-size:11px;font-weight:700;border:1px solid var(--line);border-radius:8px;padding:4px 10px;
      background:transparent;color:var(--txt2);cursor:pointer}
.ubtn.on{background:var(--red);color:#fff;border-color:var(--red)}
.clbox{display:flex;align-items:center;gap:12px;background:var(--inset);border-radius:12px;
       padding:12px 16px;margin-bottom:16px}
.clbox b{font-size:12px}
.clbox select{border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:12px;
       background:var(--card);color:var(--txt);font-family:inherit}
.clbox em{font-size:11px;color:var(--red);font-style:normal;font-weight:600}
.gbox{background:var(--card);border-radius:20px;padding:34px 34px 28px;width:340px;
      box-shadow:0 24px 60px rgba(10,15,25,.28)}
.gbrand{display:flex;align-items:center;gap:9px;margin-bottom:22px}
.gbrand .dot{width:26px;height:26px;border-radius:8px;background:var(--blue)}
.gbrand h1{font-size:15px;font-weight:800;letter-spacing:-.02em}
.gbrand p{font-size:10px;color:var(--muted);margin-top:1px}
.gbox h2{font-size:19px;font-weight:800;margin-bottom:6px}
.gbox .gp{font-size:11.5px;color:var(--muted);line-height:1.6;margin-bottom:18px}
.gbox input{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px 14px;
      font-size:13px;font-family:inherit;margin-bottom:10px;background:var(--card);color:var(--txt)}
.gbox input:focus{outline:0;border-color:var(--blue)}
.gbox .btn{width:100%;justify-content:center;padding:12px;margin-top:4px}
.gbox .gerr{background:var(--red-soft);color:var(--red);border-radius:10px;padding:10px 12px;
      font-size:11.5px;font-weight:600;margin-bottom:12px}
.gbox .gnote{font-size:10.5px;color:var(--muted);line-height:1.6;margin-top:14px;text-align:center}
/* ── 업무 줄 ── */
.tr2{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:11px;cursor:pointer;
     transition:background .12s}
.tr2:hover{background:var(--inset)}
.tr2 .dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.tr2 > div{min-width:0;flex:1}
.tr2 b{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr2 > div > span{display:block;font-size:10.5px;color:var(--muted);margin-top:2px}
.tr2 .cbadge{font-size:10.5px;color:var(--blue);background:var(--blue-soft);border-radius:7px;padding:2px 7px;font-weight:700}
.mor{padding:10px 12px;font-size:11.5px;color:var(--blue);cursor:pointer;font-weight:600}
/* ── 아코디언 ── */
.acc{border-top:1px solid var(--line)}
.acc:first-of-type{border-top:0}
.ah{display:flex;align-items:center;gap:8px;padding:12px 4px;cursor:pointer}
.ah b{font-size:13px}
.ah .car{display:inline-block;font-size:11px;color:var(--muted);transition:transform .15s}
.ah .car.on{transform:rotate(90deg)}
.ab{padding:0 0 8px 18px}
/* ── 업무 상세 · 코멘트 ── */
#tmd{max-width:640px}
#tmd .mh h3{margin-top:6px}
.tchip{display:inline-block;font-size:10px;font-weight:700;color:#fff;border-radius:6px;padding:2px 8px}
.tmeta{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}
.tmeta small{display:block;font-size:10.5px;color:var(--muted);margin-bottom:5px}
.tmeta b{font-size:12.5px}
.tdesc{padding:14px 0;font-size:12.5px;color:var(--txt2);line-height:1.7;border-bottom:1px solid var(--line)}
.cwrap{padding-top:16px}
.chd{font-size:12px;font-weight:700;margin-bottom:12px}
.chd span{color:var(--blue);margin-left:5px}
.cmt{display:flex;gap:10px;padding:10px 0}
.cmt .cm1{display:flex;align-items:center;gap:8px}
.cmt .cm1 b{font-size:12px}
.cmt .cm1 span{font-size:10.5px;color:var(--muted)}
.cmt p{font-size:12.5px;color:var(--txt2);line-height:1.65;margin-top:4px;white-space:pre-wrap}
.cempty{font-size:12px;color:var(--muted);padding:10px 0}
.cin{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding-top:14px;border-top:1px solid var(--line)}
.cin textarea{flex:1;border:1px solid var(--line);border-radius:11px;padding:10px 12px;font-size:12.5px;
   font-family:inherit;resize:vertical;background:var(--bg2,transparent);color:var(--txt)}
.cin .btn{align-self:stretch;padding:0 18px}
@media(max-width:1100px){.trks{grid-template-columns:1fr}.tmeta{grid-template-columns:repeat(2,1fr)}}
.sbcta{margin:20px 20px 0;background:var(--blue);border-radius:16px;padding:16px}
.sbcta small{font-size:10.5px;opacity:.8;display:block}
.sbcta b{font-size:14.5px;font-weight:700;display:block;margin:5px 0 12px}
.sbcta button{background:rgba(255,255,255,.16);border-radius:9px;padding:7px 12px;font-size:11.5px;font-weight:600}

.main{flex:1;min-width:0;padding:26px 32px 40px}
.wrap{max-width:1176px;margin:0 auto}

/* ---------- page header ---------- */
.ph{display:flex;align-items:flex-start;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.ph .t h2{font-size:25px;font-weight:800;letter-spacing:-.03em}
.ph .t p{font-size:12.5px;color:var(--txt2);margin-top:6px}
.ph .r{margin-left:auto;display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:var(--r-ctl);padding:4px}
.seg button{padding:7px 15px;border-radius:8px;font-size:12.5px;color:var(--txt2);font-weight:500}
.seg button.on{background:#111418;color:#fff;font-weight:600}
html[data-theme="dark"] .seg button.on{background:var(--blue)}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
        border-radius:var(--r-ctl);padding:9px 15px;min-width:210px;font-size:12.5px;color:var(--muted)}
.search .o{width:12px;height:12px;border:1.6px solid var(--muted);border-radius:50%;flex:none}
.search input{border:0;background:transparent;outline:none;font:inherit;font-size:12.5px;color:var(--txt);width:100%}
.search input::placeholder{color:var(--muted)}
.stack{display:flex}
.stack .av{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--card);margin-left:-9px}
.stack .av:first-child{margin-left:0}
.btn{background:var(--blue);color:#fff;border-radius:var(--r-ctl);padding:11px 17px;font-size:13px;font-weight:600}
.btn.sec{background:var(--card);color:var(--txt);border:1px solid var(--line)}
.btn.gh{background:transparent;color:var(--txt2)}
.tgl{width:44px;height:26px;border-radius:20px;background:var(--inset);border:1px solid var(--line);
     position:relative;flex:0 0 44px}
.tgl i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--blue);transition:.18s}
html[data-theme="dark"] .tgl i{left:20px;background:var(--amber)}

/* ---------- cards ---------- */
.av{border-radius:50%;display:inline-block;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow)}
.card.pad{padding:22px 24px}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.ch h3{font-size:15.5px;font-weight:700}
.ch .more{margin-left:auto;font-size:11.5px;color:var(--txt2)}
.pill{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:var(--r-chip);
      background:var(--blue-soft);color:var(--blue)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:18px 20px 16px;box-shadow:var(--shadow)}
.kpi.hl{background:var(--blue);border-color:var(--blue);color:#fff}
.kpi .lb{display:flex;align-items:center;font-size:12px;color:var(--txt2)}
.kpi.hl .lb{color:rgba(255,255,255,.85)}
.kpi .lb .sq{margin-left:auto;width:18px;height:18px;border-radius:6px;background:var(--inset)}
.kpi.hl .lb .sq{background:rgba(255,255,255,.22)}
.kpi .v{font-size:32px;font-weight:800;margin:9px 0 12px;letter-spacing:-.04em}
.kpi .v small{font-size:12.5px;font-weight:600;margin-left:3px;color:var(--txt2)}
.kpi.hl .v small{color:rgba(255,255,255,.8)}
.bar{height:5px;border-radius:5px;background:var(--inset);overflow:hidden}
.kpi.hl .bar{background:rgba(255,255,255,.28)}
.bar i{display:block;height:100%;border-radius:5px;background:var(--blue)}
.kpi.hl .bar i{background:#fff}
.kpi .ft{font-size:11px;color:var(--txt2);margin-top:9px}
.kpi.hl .ft{color:rgba(255,255,255,.85)}

.cols{display:grid;grid-template-columns:1.62fr 1fr;gap:18px;margin-bottom:20px}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:18px}

/* ---------- table ---------- */
table{width:100%;border-collapse:collapse}
th{font-size:11px;color:var(--muted);font-weight:600;text-align:left;padding:0 0 11px;border-bottom:1px solid var(--line)}
td{padding:13px 0;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:0}
.pn{display:flex;align-items:center;gap:11px}
.pn .tick{width:3px;height:30px;border-radius:3px;background:var(--blue);flex:0 0 3px}
.pn b{font-size:13px;font-weight:600;display:block}
.pn span{font-size:10.5px;color:var(--muted);display:block;margin-top:2px}
.pn span.nxt,.nxt{display:block;font-size:10.5px;color:var(--blue);margin-top:3px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px}
.nxtbox{display:flex;align-items:flex-start;gap:9px;background:var(--blue-soft);border-radius:12px;
  padding:12px 15px;margin-bottom:18px;font-size:12.5px;color:var(--blue);line-height:1.55}
.nxtbox b{font-weight:700;flex:none}
.who{display:flex;align-items:center;gap:8px;font-size:12.5px}
.who .av{width:22px;height:22px;border-radius:50%;flex:0 0 22px}
.pg{display:flex;align-items:center;gap:10px}
.pg .bar{flex:1;min-width:64px}
.pg span{font-size:12px;font-weight:600;width:34px;text-align:right}
.bd{font-size:11px;font-weight:700;padding:4px 9px;border-radius:var(--r-chip);display:inline-block}
.bd.진행중{background:var(--blue-soft);color:var(--blue)}
.bd.검수중{background:var(--green-soft);color:var(--green)}
.bd.지연{background:var(--red-soft);color:var(--red)}
.bd.대기{background:var(--inset);color:var(--txt2)}
.bd.완료{background:var(--inset);color:var(--txt2)}
.bd.협의중{background:var(--amber-soft);color:#b57b0e}
html[data-theme="dark"] .bd.대기,html[data-theme="dark"] .bd.완료{background:#232b39;color:#9aa5b5}
.dday{font-size:12px;font-weight:700;color:var(--txt2)}
.dday.urg{color:var(--red)}

/* ---------- dark panel ---------- */
.dp{background:var(--dark-panel);color:var(--dark-panel-txt);border-radius:var(--r-card);padding:22px 24px;border:1px solid transparent}
.dp .ch h3{color:#fff}
.dp .big{font-size:32px;font-weight:800;letter-spacing:-.04em}
.dp .big small{font-size:12.5px;font-weight:500;color:var(--dark-panel-sub);margin-left:6px}
.segbar{display:flex;gap:4px;margin:14px 0 11px}
.segbar i{height:7px;border-radius:4px}
.lg{display:flex;flex-wrap:wrap;gap:10px 14px;font-size:10.5px;color:var(--dark-panel-sub)}
.lg span{display:flex;align-items:center;gap:5px}
.lg em{width:7px;height:7px;border-radius:50%;font-style:normal}
.dp hr{border:0;border-top:1px solid rgba(255,255,255,.08);margin:18px 0 14px}
.uz{display:flex;align-items:center;gap:12px;background:var(--dark-panel-card);border-radius:12px;padding:12px 14px;margin-bottom:9px}
.uz b{font-size:12.5px;font-weight:600;display:block}
.uz span{font-size:10.5px;color:var(--dark-panel-sub);display:block;margin-top:2px}
.uz button{margin-left:auto;background:var(--blue);color:#fff;border-radius:8px;padding:6px 12px;font-size:11px;font-weight:600}

/* ---------- gantt ---------- */
.gantt{overflow-x:auto}
.gt{min-width:820px}
.gt .hdr{display:grid;grid-template-columns:170px repeat(7,1fr);padding-bottom:12px;border-bottom:1px solid var(--line)}
.gt .hdr div{text-align:center;font-size:13px;font-weight:700}
.gt .hdr div small{display:block;font-size:10px;color:var(--muted);font-weight:500;margin-top:2px}
.gt .hdr .lbl{text-align:left;font-size:11px;color:var(--muted);font-weight:600;align-self:end}
.gt .row{display:grid;grid-template-columns:170px repeat(7,1fr);align-items:center;height:48px;position:relative}
.gt .row .nm{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:12px}
.gt .row .nm small{display:block;font-size:10px;color:var(--muted);font-weight:400;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gt .track{grid-column:2 / span 7;position:relative;height:26px;overflow:hidden}
.gt .barx{position:absolute;top:0;height:26px;border-radius:8px;display:flex;align-items:center;
          padding:0 11px;font-size:11px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden}
.gt .today{position:absolute;top:0;bottom:0;width:2px;background:var(--blue);z-index:2}
.gt .barlbl{position:absolute;top:0;height:26px;display:flex;align-items:center;font-size:11px;
  font-weight:600;color:var(--txt2);white-space:nowrap;pointer-events:none}
.gt .todaycol{position:absolute;top:0;bottom:0;background:var(--blue-soft);opacity:.55;z-index:0}
html[data-theme="dark"] .gt .todaycol{background:#1b2740;opacity:.7}

/* ---------- kanban ---------- */
.kb{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.kbc{background:var(--inset);border-radius:14px;padding:14px;min-height:280px}
.kbc .kh{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;margin-bottom:12px}
.kbc .kh em{width:7px;height:7px;border-radius:50%;font-style:normal}
.kbc .kh i{margin-left:auto;font-style:normal;color:var(--muted);font-size:11.5px}
.tc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:9px}
.tc .tag{font-size:10px;font-weight:600;padding:2.5px 7px;border-radius:6px;background:var(--inset);color:var(--txt2)}
.tc b{display:block;font-size:12.5px;font-weight:600;margin:8px 0 10px;line-height:1.45}
.tc .bt{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--txt2)}
.tc .bt .av{width:18px;height:18px;border-radius:50%}
.tc .bt .d{margin-left:auto;font-weight:700}
.addbtn{width:100%;border:1.5px dashed var(--line);border-radius:11px;padding:10px;font-size:11.5px;color:var(--muted)}

/* ---------- misc ---------- */
.ms{display:flex;align-items:center;justify-content:space-between;margin:28px 0 8px;position:relative}
.ms::before{content:"";position:absolute;left:9px;right:9px;top:9px;height:2px;background:var(--line)}
.ms .n{position:relative;text-align:center;flex:1}
.ms .n i{width:18px;height:18px;border-radius:50%;background:var(--line);display:block;margin:0 auto 12px;
         border:3px solid var(--card);position:relative;z-index:1}
.ms .n.done i{background:var(--blue)}
.ms .n.cur i{background:#fff;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue)}
.ms .n b{font-size:12px;font-weight:600;display:block}
.ms .n.cur b{color:var(--blue)}
.ms .n span{font-size:10.5px;color:var(--muted)}
.ms .fill{position:absolute;left:9px;top:9px;height:2px;background:var(--blue)}
.li{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.li:last-child{border-bottom:0}
.li .chk{width:17px;height:17px;border-radius:5px;border:1.6px solid var(--line);flex:0 0 17px}
.li .chk.on{background:var(--blue);border-color:var(--blue)}
.li .tm{margin-left:auto;font-size:11.5px;color:var(--muted)}
.wk{display:flex;align-items:flex-end;justify-content:space-between;height:110px;gap:9px;margin:10px 0 6px}
.wk .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px}
.wk .b i{width:100%;max-width:26px;border-radius:7px;background:var(--inset);display:block}
.wk .b.on i{background:var(--blue)}
.wk .b span{font-size:10.5px;color:var(--muted)}
.mst{display:flex;align-items:center;gap:12px;background:var(--inset);border-radius:11px;padding:11px 13px;margin-bottom:8px;font-size:12.5px}
.mst b{color:var(--blue);font-weight:700;font-size:12px;width:38px;flex:0 0 38px}
.mst em{margin-left:auto;width:7px;height:7px;border-radius:50%;font-style:normal}
.act{display:flex;align-items:center;gap:9px;padding:8px 0;font-size:12px}
.act em{width:7px;height:7px;border-radius:50%;font-style:normal;flex:0 0 7px}
.act .t{margin-left:auto;font-size:10.5px;color:var(--muted);white-space:nowrap}
.file{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.file:last-child{border-bottom:0}
.file .ic{width:26px;height:26px;border-radius:7px;background:var(--blue-soft);flex:0 0 26px}
.file .k{color:var(--txt2);font-size:11.5px;width:80px}
.file .v{margin-left:auto;font-size:10.5px;background:var(--inset);border-radius:6px;padding:2.5px 7px;color:var(--txt2)}
.file .dl{color:var(--blue);font-size:11.5px;font-weight:600;width:52px;text-align:right}
.tree{display:grid;grid-template-columns:1fr 40px 1.15fr 40px 1fr;align-items:center;gap:0;margin-top:8px}
.tn{background:var(--inset);border-radius:13px;padding:14px 16px;margin:7px 0}
.tn.core{background:var(--card);border:1.5px solid var(--blue);box-shadow:0 6px 20px rgba(27,99,245,.12)}
.tn b{font-size:13px;font-weight:700;display:block}
.tn p{font-size:10.5px;color:var(--muted);margin:4px 0 9px}
.tn .bt{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--txt2)}
.tn .bt .av{width:17px;height:17px;border-radius:50%}
.tn .bt .r{margin-left:auto;font-weight:700}
.tn .kind{font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;display:inline-block;margin-bottom:8px}
.conn{border-left:1.5px solid var(--line);height:100%;min-height:60px}
.empty{padding:44px;text-align:center;color:var(--muted);font-size:13px}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;background:rgba(10,14,22,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:24px}
.ov.on{display:flex}
.md{background:var(--card);border-radius:22px;width:540px;max-width:100%;max-height:92vh;overflow-y:auto;padding:28px 30px}
.md .mh{display:flex;align-items:flex-start;margin-bottom:22px}
.md .mh h3{font-size:19px;font-weight:800}
.md .mh p{font-size:11.5px;color:var(--txt2);margin-top:5px}
.md .mh .x{margin-left:auto;width:30px;height:30px;border-radius:9px;background:var(--inset);color:var(--txt2);font-size:15px}
.fl{margin-bottom:16px}
.fl label{display:block;font-size:11.5px;font-weight:600;margin-bottom:7px}
.fl label i{color:var(--red);font-style:normal}
.fl label u{float:right;text-decoration:none;color:var(--muted);font-weight:400}
.fl input,.fl select,.fl textarea{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-ctl);
  padding:12px 14px;font:inherit;font-size:12.5px;color:var(--txt);outline:none}
.fl textarea{min-height:74px;resize:vertical}
.fl input:focus,.fl select:focus,.fl textarea:focus{border-color:var(--blue)}
.fl .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{display:flex;align-items:center;gap:7px;border:1.5px solid var(--line);border-radius:20px;padding:7px 13px;font-size:12px}
.chip .av{width:16px;height:16px;border-radius:50%}
.chip.on{border-color:var(--blue);color:var(--blue);font-weight:600}
.opts{display:flex;gap:8px}
.opts button{flex:1;background:var(--inset);border-radius:9px;padding:10px;font-size:12px;color:var(--txt2)}
.opts button.on{background:var(--red);color:#fff;font-weight:600}
.opts.dk button.on{background:#111418;color:#fff}
html[data-theme="dark"] .opts.dk button.on{background:var(--blue)}
.mf{display:flex;align-items:center;gap:10px;margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}
.mf small{font-size:11px;color:var(--muted)}
.mf .sp{margin-left:auto}
#whobar{display:none;margin:0 20px 14px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);
  border-radius:11px;padding:9px 12px;font-size:12px;color:#fff}
#whobar b{font-weight:700}
#whobar span{font-size:10.5px;color:var(--sbmuted)}
#whobar button{margin-left:auto;font-size:10.5px;color:#fff;background:rgba(255,255,255,.14);border-radius:7px;padding:4px 9px}
#whobar.demo{background:rgba(245,166,35,.16);color:#f5a623}
#whobar.demo b{color:#f5a623}
.gate{position:fixed;inset:0;background:rgba(8,11,18,.78);display:none;align-items:center;justify-content:center;z-index:80}
.gate.on{display:flex}
.gatebox{background:var(--card);border-radius:22px;padding:32px 34px;text-align:center;max-width:520px}
.gatebox h3{font-size:20px;font-weight:800}
.gatebox p{font-size:12.5px;color:var(--txt2);margin:8px 0 22px}
.gaterow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.gaterow button{display:flex;flex-direction:column;align-items:center;gap:7px;border:1.5px solid var(--line);
  border-radius:16px;padding:18px 22px;min-width:132px;transition:.15s}
.gaterow button:hover{border-color:var(--blue);background:var(--blue-soft)}
.gaterow button b{font-size:13.5px}
.gaterow button small{font-size:10.5px;color:var(--muted)}
.gatebox input{width:100%;background:var(--inset);border:1.5px solid var(--line);border-radius:var(--r-ctl);
  padding:13px 15px;font:inherit;font-size:13px;color:var(--txt);outline:none;text-align:center}
.gatebox input:focus{border-color:var(--blue)}
.gateerr{background:var(--red-soft);color:var(--red);border-radius:10px;padding:10px 14px;font-size:12px;margin-bottom:14px}
.gatehint{display:block;font-size:11px;color:var(--muted);margin-top:12px}
.tc{cursor:pointer}
.tc:hover{border-color:var(--blue)}
.li .chk{cursor:pointer}
.by{font-size:10px;color:var(--muted);margin-left:6px}
.ptabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.ptab{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);
  border-radius:22px;padding:8px 15px 8px 10px;font-size:12.5px;transition:.15s}
.ptab:hover{border-color:var(--blue)}
.ptab.on{border-color:var(--blue);background:var(--blue);color:#fff;font-weight:600}
.ptab.on .cnt{background:rgba(255,255,255,.25);color:#fff}
.ptab .cnt{font-size:10.5px;background:var(--inset);color:var(--txt2);border-radius:7px;padding:2px 7px}
.ptab .all{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#1b63f5,#23a18f,#f5a623);flex:none}
.psec{margin-bottom:22px}
.psec > b{display:block;font-size:12.5px;font-weight:700;margin-bottom:10px}
.pline{display:flex;align-items:flex-start;gap:9px;padding:7px 0;font-size:12.5px;border-bottom:1px solid var(--line)}
.pline:last-child{border-bottom:0}
.pline em{width:6px;height:6px;border-radius:50%;font-style:normal;flex:none;margin-top:6px}
.pline .p{font-size:10.5px;color:var(--muted);margin-left:auto;white-space:nowrap}
.pcard{background:var(--inset);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.pcard .ph2{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.pcard .ph2 b{font-size:13.5px}
.pcard .ph2 small{font-size:10.5px;color:var(--muted)}
.pcard .ph2 .st{margin-left:auto;font-size:11px;color:var(--txt2)}
.toast{position:fixed;right:24px;bottom:24px;left:auto;transform:translateY(16px);background:#111418;color:#fff;
  padding:14px 16px 14px 18px;border-radius:14px;font-size:13px;line-height:1.5;opacity:0;transition:.22s;
  z-index:99;pointer-events:none;max-width:360px;box-shadow:0 12px 32px rgba(0,0,0,.35);
  display:flex;align-items:flex-start;gap:12px}
.toast.on{opacity:1;transform:translateY(0);pointer-events:auto}
.toast .tmsg{flex:1;min-width:0;word-break:break-word}
.toast .tx{flex:0 0 18px;width:18px;height:18px;border-radius:6px;background:rgba(255,255,255,.12);
  color:#fff;font-size:11px;line-height:18px;text-align:center;cursor:pointer;margin-top:1px}
.toast .tx:hover{background:rgba(255,255,255,.24)}
.toast .tbar{position:absolute;left:0;bottom:0;height:2px;background:var(--blue);border-radius:0 0 14px 14px}
@media(max-width:820px){.toast{right:12px;left:12px;bottom:12px;max-width:none}}
/* 상태 선택기 — 배지처럼 보이지만 실제로는 select 다 */
.ssel{border:0;border-radius:8px;padding:4px 8px;font-size:11px;font-weight:700;font-family:inherit;
  cursor:pointer;appearance:none;-webkit-appearance:none;text-align:center}
.ssel:focus{outline:2px solid var(--blue);outline-offset:1px}
.ssel.대기{background:var(--inset);color:var(--txt2)}
.ssel.진행중{background:var(--blue-soft);color:var(--blue)}
.ssel.검수중{background:var(--green-soft);color:var(--green)}
.ssel.완료{background:var(--inset);color:var(--muted)}
.ssel.지연{background:var(--red-soft);color:var(--red)}
.ssel.협의중{background:var(--amber-soft);color:#b57b0e}
.tc .bt .nm2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.tc .bt{display:flex;align-items:center;gap:6px;min-width:0}
.tc .bt2{margin-top:7px;display:flex}
.tc .bt2 .ssel{width:100%}
.kb.kb5{grid-template-columns:repeat(5,1fr)}
.kb.kb4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1400px){.kb.kb5,.kb.kb4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:1180px){.cols,.cols2{grid-template-columns:1fr}.grid4{grid-template-columns:1fr 1fr}.cols3{grid-template-columns:1fr}.kb{grid-template-columns:1fr}}
@media(max-width:820px){.sb{display:none}.main{padding:18px}.grid4{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <aside class="sb">
    <div class="brand"><div class="dot"></div><div><h1>HAYDAY</h1><p>Work Management</p></div></div>
    <div class="me" id="mecard"></div>
    <nav class="nav" id="nav"></nav>
    <hr>
    <div class="team">
      <div class="hd"><b>팀 담당자</b><i id="s-mem">0명</i></div>
      <div id="memlist"></div>
    </div>
    <hr>
    <div class="qlk">
      <div class="hd"><b>바로가기</b><i id="s-lnk">0곳</i></div>
      <div id="qlinks"></div>
    </div>
    <div class="sbcta">
      <small>금주 마감 임박</small><b id="s-urg">0건의 업무 확인 필요</b>
      <button onclick="location.hash='#/tasks'">바로 확인하기</button>
    </div>
  </aside>
  <main class="main"><div class="wrap" id="view"></div></main>
</div>

<div class="ov" id="ov" onclick="if(event.target===this)closeModal()">
  <div class="md">
    <div class="mh"><div><h3>업무 등록</h3><p>프로젝트에 새 업무를 추가하고 담당자를 지정합니다</p></div><button class="x" onclick="closeModal()">✕</button></div>
    <div class="fl"><label>프로젝트 <i>*</i></label><select id="f-proj" onchange="onProjSel()"></select></div>
    <div class="fl" id="f-newwrap" style="display:none">
      <label>새 프로젝트 <i>*</i></label>
      <input id="f-newname" placeholder="프로젝트 이름 — 예: 사하구 원도심 활성화 용역">
      <div class="two" style="margin-top:8px">
        <input id="f-newclient" placeholder="발주처 — 예: 사하구청">
        <select id="f-newtrack"></select></div>
      <input id="f-newnext" placeholder="지금 해야 할 일 (필수) — 예: 공고문 분석 후 착수 판단" style="margin-top:8px">
    </div>
    <div class="fl"><label>업무명 <i>*</i></label><input id="f-title" placeholder="예: 제안서 본문 6~8장 편집디자인"></div>
    <div class="fl"><label>상세 내용</label><textarea id="f-desc" placeholder="추진전략 · 세부 실행계획 페이지 레이아웃 정리 후 1차 시안 공유"></textarea></div>
    <div class="fl"><label>추진 기간 <i>*</i></label><div class="two"><input type="date" id="f-s"><input type="date" id="f-e"></div></div>
    <div class="fl"><label>담당자 지정 <i>*</i><u id="f-memcnt"></u></label><div class="chips" id="f-mem"></div></div>
    <div class="fl"><div class="two">
      <div><label>우선순위</label><div class="opts" id="f-prio">
        <button data-v="낮음">낮음</button><button data-v="보통">보통</button><button data-v="높음" class="on">높음</button><button data-v="긴급">긴급</button></div></div>
      <div><label>관리 주기</label><div class="opts dk" id="f-cyc">
        <button data-v="일간">일간</button><button data-v="주간" class="on">7일</button><button data-v="월간">월간</button></div></div>
    </div></div>
    <div class="mf"><small>등록 시 담당자에게 알림이 전송됩니다</small>
      <button class="btn sec sp" onclick="closeModal()">취소</button>
      <button class="btn" onclick="submitTask()">업무 등록</button></div>
  </div>
</div>
<div class="ov" id="tov" onclick="if(event.target===this)closeTask()">
  <div class="md" id="tmd"></div>
</div>
<div class="gate" id="gate"></div>
<div class="toast" id="toast" style="position:fixed"></div>

<script>
const MODE = 'gh';     // 'static' 데모 · 'server' 맥 서버 · 'gh' GitHub 저장
const GH   = {"owner": "andy555-cmyk", "repo": "hayday-board-data", "path": "board.json", "branch": "main"};           // {owner, repo, path, branch}
const API  = MODE !== 'static';
let DATA = {};
let ME = null;                          // 현재 기입자 id
let M = {}, P = {};
function reindex(){ if(!DATA||!DATA.members) return; M=Object.fromEntries(DATA.members.map(m=>[m.id,m])); P=Object.fromEntries(DATA.projects.map(p=>[p.id,p])); }
/* ★ TODAY 는 '보는 사람의 로컬 날짜'다. toISOString() 은 UTC 라 한국(UTC+9)에서는
   00:00~09:00 사이에 하루 전 날짜가 나온다. 그 시간대에 '오늘 한 일'이 통째로 사라진다.
   2026-08-03 01:15 KST 실측으로 확인. UTC 로 되돌리지 마라. */
const TODAY = (()=>{ const d=new Date(); return new Date(d.getFullYear(),d.getMonth(),d.getDate()); })();
const NAV = [
  ['dashboard','대시보드'],['tasks','업무관리'],['projects','프로젝트'],
  ['schedule','스케줄'],['report','리포트'],['activity','활동 이력'],
  ['assign','담당자 배정'],['orders','수주 · 연계']
];
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const av = (id,sz=22)=>`<span class="av" style="width:${sz}px;height:${sz}px;background:${M[id]?M[id].color:'#ccc'}"></span>`;
const dday = d => Math.round((new Date(d+'T00:00:00')-TODAY)/864e5);
const ddayTxt = d => { const n=dday(d); return n<0?`D+${-n}`:`D-${n}`; };
let PERIOD = 'week';                      // day | week | month
let ORDP   = 'half';                      // quarter | half | year
let QUERY  = '';                          // 검색어
let BOARDVIEW = 'board';                  // board | list | gantt
let LINKF  = '전체';                       // 연계 필터
let RPERSON = 'all';                      // 리포트 담당자 탭
let OPENP  = {};                          // 업무관리 프로젝트 접기 상태
let OPENT  = null;                        // 열려 있는 업무 상세 id
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-`+
                 `${String(d.getDate()).padStart(2,'0')}`;   // 로컬 기준. toISOString 금지(위 주석)
function periodRange(){
  const t = TODAY;
  if(PERIOD==='day'){ return {s:new Date(t), e:new Date(t), n:1, label:fmtD(t)+' ('+'일월화수목금토'[t.getDay()]+')'}; }
  if(PERIOD==='month'){
    const a=new Date(t.getFullYear(),t.getMonth(),1), b=new Date(t.getFullYear(),t.getMonth()+1,0);
    return {s:a,e:b,n:b.getDate(),label:(t.getMonth()+1)+'월 · '+fmtD(a)+' ~ '+fmtD(b)};
  }
  // 최근 7일 롤링 — 오늘을 끝으로 잡는다.
  // 월~일 고정 주로 잡으면 월요일 아침마다 지난주 성과가 통째로 화면에서 사라진다(2026-08-03 실측).
  const b=new Date(t);
  const a=new Date(t); a.setDate(t.getDate()-6);
  return {s:a,e:b,n:7,label:'최근 7일 · '+fmtD(a)+' ~ '+fmtD(b)};
}
const fmtD = d => `${d.getFullYear()}. ${String(d.getMonth()+1).padStart(2,'0')}. ${String(d.getDate()).padStart(2,'0')}`;
function inRange(t,r){ return !(new Date(t.end+'T00:00:00') < r.s || new Date(t.start+'T00:00:00') > r.e); }
/* ★ 업무(관리 대상) 와 활동 이력(끝난 기록) 을 나눈다.
   섞어 두면 목록이 수백 줄이 되고 '지금 뭘 해야 하는가'가 안 보인다. */
const LIVE = () => DATA.tasks.filter(t=>!t.log);
const LOGS = () => DATA.tasks.filter(t=>t.log);
const TRACKS = () => DATA.tracks||[{id:'own',name:'전체',desc:'',color:'#3b6cf5'}];
const TRK = id => TRACKS().find(t=>t.id===id)||TRACKS()[0];
const projOf = tid => DATA.projects.filter(p=>p.track===tid);
function periodTasks(){ const r=periodRange(); return LIVE().filter(t=>inRange(t,r)); }
function periodLogs(){ const r=periodRange(); return LOGS().filter(t=>inRange(t,r)); }
/* 프로젝트 한 건의 상태 요약 — 화면 여러 곳에서 같은 계산을 쓴다 */
function pstat(pid){
  const live=LIVE().filter(t=>t.p===pid);
  return {live:live.length, run:live.filter(t=>t.status==='진행중').length,
          late:live.filter(t=>t.status==='지연').length,
          urg:live.filter(t=>dday(t.due)<=3).length,
          done:LOGS().filter(t=>t.p===pid).length};
}
/* 최근 7일 일별 완료 건수 — 완료일(end) 기준. 지어낸 숫자를 쓰지 않는다 */
function dailyDone(){
  const out=[];
  for(let i=6;i>=0;i--){
    const d=new Date(TODAY); d.setDate(TODAY.getDate()-i);
    const key=ymd(d);
    out.push({date:key.slice(5).replace('-','.'), wd:'일월화수목금토'[d.getDay()],
              n:DATA.tasks.filter(t=>t.status==='완료'&&t.end===key).length});  // 로그 포함
  }
  return out;
}
function setPeriod(p){ PERIOD=p; render(); }
function setOrdP(p){ ORDP=p; render(); }
function setBoardView(v){ BOARDVIEW=v; render(); }
function setLinkF(v){ LINKF=v; render(); }
function setRPerson(v){ RPERSON=v; render(); }
function togAcc(id){ OPENP[id]=OPENP[id]===false; render(); }
async function setTrack(pid,tid){
  if(API){ await push('project.track',{id:pid,track:tid}); }
  else { P[pid].track=tid; render(); }
}
function doSearch(v){ QUERY=v.trim(); render(); if(QUERY){ const i=document.getElementById('q'); if(i){i.focus(); i.setSelectionRange(i.value.length,i.value.length);} } }
const tone = st => st==='지연'?'var(--red)':st==='완료'?'var(--muted)':st==='검수중'?'var(--green)':'var(--blue)';
const URG = t => t.prio==='긴급';
const urgTag = t => URG(t)?'<span class="ug">긴급</span>':'';
/* 긴급 → 보통 토글. 한 번 눌러 격상하고 한 번 눌러 내린다 */
async function toggleUrgent(id){
  const t=DATA.tasks.find(x=>x.id===id); if(!t) return;
  const nx = URG(t) ? '높음' : '긴급';
  if(API){ if(await push('task.prio',{id,prio:nx})) { if(OPENT) drawTask(); } }
  else { t.prio=nx; render(); if(OPENT) drawTask(); }
}
const fmt = n => n.toLocaleString('ko-KR');

/* ---------- sidebar ---------- */

  document.getElementById('nav').innerHTML = NAV.map(([k,l])=>

    `<div class="mem"><span class="av ${m.kind==='ai'?'ai':''}" style="background:${m.color}"></span>
     <div><div class="nm">${esc(m.name)}</div><div class="rl">${esc(m.role)}</div></div>
     <span class="cnt">${LIVE().filter(t=>t.a===m.id).length}</span></div>`).join('');

    <div class="stats">
      <div class="st"><b>${myProj.size}</b><span>담당 프로젝트</span></div>
      <div class="st"><b>${mine.filter(t=>t.status==='진행중').length}</b><span>진행 업무</span></div></div>
    ${MODE==='static'?'<div class="demo">데모 모드 · 저장되지 않습니다</div>':''}` : '';
  quicklinks();
  document.getElementById('s-mem').textContent = DATA.members.length+'명';

}

/* ---------- 바로가기 (board.json 의 sites) ----------
   URL 을 코드에 박지 않는다. sites 를 고치면 사이드바·프로젝트 화면이 같이 바뀐다. */
const SITECOLOR = {'회사':'#3b6cf5','운영':'#8b5cf6','자체 도구':'#12a35b','서비스':'#e0a413'};
const sites = () => (DATA.sites||[]);
const isLocal = u => /^https?:\/\/(localhost|127\.0\.0\.1)/.test(u);
const siteSq = s => `<span class="sq" style="background:${SITECOLOR[s.group]||'#6b7280'}">${esc(s.name.slice(0,1))}</span>`;
function quicklinks(){
  const el=document.getElementById('qlinks'); if(!el) return;
  const list=sites();
  document.getElementById('s-lnk').textContent = list.length+'곳';
  const groups=[...new Set(list.map(s=>s.group))];
  el.innerHTML = groups.map(g=>`<div class="gp">${esc(g)}</div>`+
    list.filter(s=>s.group===g).map(s=>
      `<a href="${esc(s.url)}" target="_blank" rel="noopener" title="${esc(s.note||'')}\n${esc(s.url)}">
        ${siteSq(s)}<span>${esc(s.name)}</span>
        ${isLocal(s.url)?'<span class="lo">맥</span>':'<span class="ex">↗</span>'}</a>`).join('')
  ).join('');
}
/* 프로젝트 화면용 — 그 프로젝트에 걸린 링크만 */
function siteRow(pid){
  const list = pid ? sites().filter(s=>s.p===pid) : sites();
  if(!list.length) return '';
  return `<div class="lnkrow">${list.map(s=>
    `<a href="${esc(s.url)}" target="_blank" rel="noopener" title="${esc(s.url)}">
      ${siteSq(s)}${esc(s.name)}${s.note?`<small>${esc(s.note)}</small>`:''}
      ${isLocal(s.url)?'<small>맥 전용</small>':'<small>↗</small>'}</a>`).join('')}</div>`;
}

/* ---------- shared blocks ---------- */
function kpiRow(items){
  return `<div class="grid4">`+items.map((k,i)=>`
    <div class="kpi ${i===0?'hl':''}">
      <div class="lb">${esc(k.label)}<span class="sq"></span></div>
      <div class="v">${k.value}<small>${esc(k.unit||'')}</small></div>
      <div class="bar"><i style="width:${k.pct}%;background:${i===0?'#fff':(k.color||'var(--blue)')}"></i></div>
      <div class="ft">${esc(k.foot)}</div>
    </div>`).join('')+`</div>`;
}
function ganttRows(tasks){
  const r = periodRange();
  const seen=new Set();
  tasks = tasks.filter(t=>inRange(t,r)).filter(t=>{ if(seen.has(t.p))return false; seen.add(t.p); return true; }).slice(0,8);
  if(!tasks.length) return `<div class="empty">이 기간에 걸쳐 있는 업무가 없습니다.</div>`;

  const D0 = new Date(r.s), N = r.n, col = 1/N;
  const todayIdx = Math.round((TODAY - D0)/864e5);
  const heads=[];
  for(let i=0;i<N;i++){
    const d=new Date(D0); d.setDate(D0.getDate()+i);
    const show = N<=7 || d.getDate()===1 || d.getDate()%5===0 || i===todayIdx;
    heads.push(`<div style="${i===todayIdx?'color:var(--blue);font-weight:800':''};${show?'':'opacity:.25'}">
      ${show?String(d.getDate()).padStart(2,'0'):'·'}${N<=7?`<small>${'일월화수목금토'[d.getDay()]}</small>`:''}</div>`);
  }
  return `<div class="gantt"><div class="gt" style="min-width:${Math.max(820, 170+N*34)}px">
    <div class="hdr" style="grid-template-columns:170px repeat(${N},1fr)"><div class="lbl">프로젝트 / 담당자</div>${heads.join('')}</div>
    <div style="position:relative;padding-top:10px">
      ${todayIdx>=0&&todayIdx<N?`<div class="todaycol" style="left:calc(170px + (100% - 170px) * ${todayIdx*col});width:calc((100% - 170px) * ${col})"></div>`:''}
      ${tasks.map(t=>{
        const s0=Math.max(0,Math.round((new Date(t.start+'T00:00:00')-D0)/864e5));
        const e0=Math.min(N-1,Math.round((new Date(t.end+'T00:00:00')-D0)/864e5));
        const w=Math.max(1,e0-s0+1);
        const nm=P[t.p].name.replace(/\s*\(.*?\)/,'');
        return `<div class="row" style="grid-template-columns:170px repeat(${N},1fr)">
        <div class="nm">${esc(nm)}<small>${esc(M[t.a].name)}</small></div>
        <div class="track" style="grid-column:2 / span ${N}"><div class="barx" title="${esc(t.title)}"
          style="left:${s0*col*100}%;width:${w*col*100}%;background:${tone(t.status)}">${w*col>0.14?esc(t.title):''}</div>
          ${w*col>0.14?'':`<span class="barlbl" style="left:calc(${(s0+w)*col*100}% + 8px)">${esc(t.title)}</span>`}</div></div>`;
      }).join('')}
    </div></div></div>`;
}

/* 일간 — 간트 대신 오늘 할 일 목록이 실용적이다 */
function dayBoard(){
  const r=periodRange(), list=LIVE().filter(t=>inRange(t,r));
  if(!list.length) return `<div class="empty">오늘 진행 중인 업무가 없습니다.</div>`;
  const byMem={}; list.forEach(t=>(byMem[t.a]=byMem[t.a]||[]).push(t));
  return `<div class="cols3">${Object.entries(byMem).map(([mid,ts])=>`
    <div style="background:var(--inset);border-radius:14px;padding:14px">
      <div style="display:flex;align-items:center;gap:9px;margin-bottom:12px">
        ${av(mid,26)}<b style="font-size:12.5px">${esc(M[mid].name)}</b>
        <span style="margin-left:auto;font-size:11px;color:var(--muted)">${ts.length}건</span></div>
      ${ts.map(t=>`<div class="tc ${URG(t)?'urgent':''}" onclick="openTask('${t.id}')" title="클릭하면 상세가 열립니다">
        <span class="tag">${esc(t.tag)}</span>${urgTag(t)}<b>${esc(t.title)}</b>
        <div class="bt">${statusSel(t)}
        <span class="d" style="${dday(t.due)<=2&&t.status!=='완료'?'color:var(--red)':''}">${t.status==='완료'?'완료':ddayTxt(t.due)}</span></div></div>`).join('')}
    </div>`).join('')}</div>`;
}
function timeline(){ return PERIOD==='day' ? dayBoard() : ganttRows(LIVE()); }

/* ---------- views ---------- */
function vDashboard(){
  const live=LIVE();
  const mine=ME?live.filter(t=>t.a===ME):live;
  const today=mine.filter(t=>t.status!=='완료'&&dday(t.due)<=0);
  const wk=live.filter(t=>t.status!=='완료'&&dday(t.due)>=0&&dday(t.due)<=7);
  const late=live.filter(t=>t.status==='지연'||(t.status!=='완료'&&dday(t.due)<0));
  const meName=ME&&M[ME]?M[ME].name:'전체';

  /* 3축 요약 — 프로젝트를 낱개로 뿌리지 않는다 */
  const trackCards = TRACKS().filter(tr=>projOf(tr.id).length).map(tr=>{
    const ps=projOf(tr.id);
    const st=ps.reduce((a,pr)=>{const x=pstat(pr.id);
      return {live:a.live+x.live, late:a.late+x.late, urg:a.urg+x.urg, done:a.done+x.done};},
      {live:0,late:0,urg:0,done:0});
    const avg=ps.length?Math.round(ps.reduce((a,pr)=>a+pr.progress,0)/ps.length):0;
    const near=ps.slice().sort((a,b)=>dday(a.due)-dday(b.due))[0];
    return `<div class="trk" onclick="location.hash='#/projects'" style="--tc:${tr.color}">
      <div class="th"><b>${esc(tr.name)}</b><span class="pill">${ps.length}개</span></div>
      <p>${esc(tr.desc)}</p>
      <div class="tbar"><i style="width:${avg}%"></i></div>
      <div class="tm2"><span>평균 <b>${avg}%</b></span><span>업무 <b>${st.live}</b></span>
        ${st.late?`<span class="rd">지연 <b>${st.late}</b></span>`:`<span>완료 <b>${st.done}</b></span>`}</div>
      ${near?`<div class="tn2">가장 가까운 마감 · ${esc(near.name.slice(0,18))} <b>${ddayTxt(near.due)}</b></div>`:''}
    </div>`;}).join('');

  const row = t => `<div class="tr2 ${URG(t)?'urgent':''}" onclick="openTask('${t.id}')">
    <span class="dot" style="background:${URG(t)?'var(--red)':tone(t.status)}"></span>
    <div><b>${urgTag(t)}${esc(t.title)}</b><span>${esc(P[t.p].name.replace(/\s*\(.*?\)/,'').slice(0,18))} · ${esc(M[t.a].name)}</span></div>
    ${t.comments&&t.comments.length?`<span class="cbadge">💬 ${t.comments.length}</span>`:''}
    <span class="dday ${dday(t.due)<=1?'urg':''}">${ddayTxt(t.due)}</span></div>`;

  const urg=live.filter(URG);
  return siteRow(null)+kpiRow([
    {label:'★ 긴급',value:urg.length,unit:'건',pct:Math.min(100,urg.length*25),color:'var(--red)',
     foot:urg.length?urg[0].title.slice(0,22):'격상된 업무 없음'},
    {label:meName+' · 오늘 할 일',value:today.length,unit:'건',pct:100,foot:today.length?'기한이 오늘이거나 지났습니다':'오늘 마감은 없습니다'},
    {label:'7일 내 마감',value:wk.length,unit:'건',pct:Math.min(100,wk.length*8),foot:'전사 기준'},
    {label:'지연 · 미지정',value:late.length+DATA.unassigned.length,unit:'건',pct:Math.min(100,(late.length+DATA.unassigned.length)*12),color:'var(--amber)',
     foot:`지연 ${late.length} · 미지정 ${DATA.unassigned.length}`}
  ])
  +(urg.length?`<div class="card pad urgbox"><div class="ch"><h3>★ 긴급 — 다른 일보다 먼저</h3>
      <span class="pill" style="background:var(--red);color:#fff">${urg.length}건</span></div>
      ${urg.slice().sort((a,b)=>a.due.localeCompare(b.due)).map(row).join('')}</div>`:'')
  +`<div class="trks">${trackCards}</div>
  <div class="cols">
    <div class="card pad">
      <div class="ch"><h3>${esc(meName)} · 지금 할 일</h3>
        <span class="pill">${mine.filter(t=>t.status!=='완료').length}건</span>
        <button class="btn" style="margin-left:auto" onclick="openModal()">+ 업무 등록</button></div>
      ${(()=>{const l=mine.filter(t=>t.status!=='완료').slice().sort((a,b)=>(URG(b)-URG(a))||a.due.localeCompare(b.due));
        return l.length?l.slice(0,9).map(row).join('')+(l.length>9?`<div class="mor" onclick="location.hash='#/tasks'">외 ${l.length-9}건 — 업무관리에서 전체보기</div>`:'')
                       :'<div class="empty">할 일이 없습니다.</div>';})()}
    </div>
    <div class="dp">
      <div class="ch"><h3>최근 활동</h3><span class="pill" style="margin-left:auto">${DATA.activity.length}</span></div>
      ${DATA.activity.slice(0,9).map(a=>`<div class="act">
        <em style="background:${M[a.who]?M[a.who].color:'#888'}"></em>
        ${esc(a.text.length>30?a.text.slice(0,30)+'…':a.text)}
        <span class="t">${esc(a.when)}</span></div>`).join('')}
      <hr>
      <div style="display:flex;align-items:center;margin-bottom:12px"><b style="font-size:12.5px">담당자 미지정</b>
        <span style="margin-left:auto;color:var(--red);font-size:11px;font-weight:700">${DATA.unassigned.length}건</span></div>
      ${DATA.unassigned.slice(0,3).map(u=>`<div class="uz"><div><b>${esc(u.title.length>22?u.title.slice(0,22)+'…':u.title)}</b>
        <span>${esc(P[u.p].name.slice(0,16))}</span></div><button onclick="openModal('${u.p}','${esc(u.title)}')">지정</button></div>`).join('')}
    </div>
  </div>
  <div class="card pad" style="margin-bottom:20px">
    <div class="ch"><h3>스케줄표 · ${{day:'일간',week:'최근 7일',month:'월간'}[PERIOD]} 타임라인</h3>
      <span style="font-size:11.5px;color:var(--muted)">${periodRange().label}</span>
      <div class="seg" style="margin-left:auto">${[['day','일'],['week','7일'],['month','월']].map(([k,l])=>
        `<button class="${PERIOD===k?'on':''}" onclick="setPeriod('${k}')">${l}</button>`).join('')}</div></div>
    ${timeline()}
  </div>
  <div class="cols3">
    <div class="card pad"><div class="ch"><h3>최근 7일 · 일별 완료</h3>
      <span class="pill" style="margin-left:auto;background:var(--green-soft);color:var(--green)">${periodLogs().length}건</span></div>
      <div class="wk">${dailyDone().map((c,i,arr)=>{
        const mx=Math.max(1,...arr.map(x=>x.n));
        return `<div class="b ${i===arr.length-1?'on':''}" title="${c.date} · 완료 ${c.n}건">
          <i style="height:${Math.round(6+c.n/mx*78)}px"></i><span>${c.wd}</span></div>`;}).join('')}</div>

  const ts=LIVE().filter(t=>t.p===id);

  /* ★ 칸이 없으면 그 상태의 업무가 화면에서 사라진다. 2026-08-04 실측 —
     '검수중' 칸이 없어 4건 중 3건이 안 보였다. 상태를 늘리면 칸도 같이 늘려라. */

      <button class="tgl" onclick="toggleTheme()" title="라이트 / 다크"><i></i></button></div></div>
  <div class="nxtbox"><b>해야 할 일</b><span>${esc(p.next||'확인 필요')}</span></div>
  <div class="clbox"><b>발주처</b>
    <select onchange="setTrack('${p.id}',this.value)">
      ${TRACKS().map(tr=>`<option value="${tr.id}" ${p.track===tr.id?'selected':''}>${esc(tr.name)}</option>`).join('')}
    </select>
    ${p.track==='none'?'<em>지정되지 않았습니다 — 골라 주세요</em>':''}</div>
  ${siteRow(p.id)}
  ${kpiRow([
    {label:'전체 진행률',value:p.progress,unit:'%',pct:p.progress,foot:esc(p.progressNote||'근거 확인 필요')},
    {label:'완료 기록',value:lg.length,unit:'건',pct:(lg.length+ts.length)?Math.round(lg.length/(lg.length+ts.length)*100):0,foot:`남은 업무 ${ts.length}건`},
    {label:'잔여 기간',value:Math.max(0,dday(p.due)),unit:'일',pct:60,foot:`기한 ${p.due.slice(5).replace('-','.')}`},
    {label:'투입 인원',value:p.team.length,unit:'명',pct:100,color:'var(--violet)',foot:p.team.map(t=>M[t].name).join(' · ')}
  ])}
  <div class="cols">
    <div class="card pad"><div class="ch"><h3>업무 보드</h3><span class="pill">총 ${ts.length}건</span>
      <div class="seg" style="margin-left:auto;padding:3px">${[['board','보드'],['list','리스트'],['gantt','간트']].map(([k,l])=>
        `<button class="${BOARDVIEW===k?'on':''}" style="padding:5px 12px;font-size:11.5px" onclick="setBoardView('${k}')">${l}</button>`).join('')}</div></div>
      ${BOARDVIEW==='list'?`<table><thead><tr><th>업무</th><th>담당자</th><th>주기</th><th>상태</th><th style="text-align:right">기한</th></tr></thead><tbody>
        ${ts.map(t=>`<tr><td><b style="font-weight:600">${esc(t.title)}</b>
          <span style="display:block;font-size:10.5px;color:var(--muted);margin-top:2px">${esc(t.tag)}</span></td>
          <td><div class="who">${av(t.a)}${esc(M[t.a].name)}</div></td>
          <td style="font-size:12px;color:var(--txt2)">${t.cycle}</td>
          <td>${statusSel(t)}</td>
          <td style="text-align:right"><span class="dday ${dday(t.due)<=2&&t.status!=='완료'?'urg':''}">${t.status==='완료'?'—':ddayTxt(t.due)}</span></td></tr>`).join('')}

        return `<div class="kbc"><div class="kh"><em style="background:${color}"></em>${c}<i>${list.length}</i></div>
        ${list.map(t=>`<div class="tc ${URG(t)?'urgent':''}" onclick="openTask('${t.id}')" title="클릭하면 상세가 열립니다">
          <span class="tag">${esc(t.tag)}</span>${urgTag(t)}<b>${esc(t.title)}</b>
          <div class="bt">${av(t.a,18)}<span class="nm2">${esc(M[t.a].name)}</span>
          <span class="d" style="margin-left:auto;${dday(t.due)<=3&&t.status!=='완료'?'color:var(--red)':''}">${t.status==='완료'?'완료':ddayTxt(t.due)}</span></div>
          <div class="bt2">${statusSel(t)}</div></div>`).join('')}
        <button class="addbtn" onclick="openModal('${p.id}')">+ 업무 추가</button></div>`;
      }).join('')}</div>`}
    </div>
    <div>
      <div class="card pad" style="margin-bottom:18px"><div class="ch"><h3>담당자 · 역할 배정</h3><span class="pill" style="margin-left:auto;cursor:pointer" onclick="location.hash='#/assign'">편집</span></div>
        ${p.team.map(t=>`<div style="display:flex;align-items:center;gap:11px;background:var(--inset);border-radius:12px;padding:11px 13px;margin-bottom:8px">
          ${av(t,28)}<div><div style="font-size:12.5px;font-weight:600">${esc(M[t].name)}</div>
          <div style="font-size:10.5px;color:var(--muted)">${esc(M[t].role)}</div></div>
          <div style="margin-left:auto;text-align:right"><div style="font-size:12px;font-weight:700">${byMem[t]||0}건</div>
          <div class="bar" style="width:56px;margin-top:5px"><i style="width:${Math.min(100,(byMem[t]||0)*33)}%;background:${M[t].color}"></i></div></div></div>`).join('')}
      </div>
      <div class="card pad"><div class="ch"><h3>최근 활동</h3></div>
        ${DATA.activity.slice(0,5).map(a=>`<div class="act"><em style="background:${M[a.who].color}"></em>
          ${esc(M[a.who].name)} · ${esc(a.text.length>26?a.text.slice(0,26)+'…':a.text)}${a.by&&M[a.by]?`<span class="by">by ${esc(M[a.by].name)}</span>`:''}<span class="t">${esc(a.when)}</span></div>`).join('')}
      </div>
    </div>
  </div>
  <div class="card pad" style="margin:20px 0">
    <div class="ch"><h3>마일스톤 진행 단계</h3><span style="font-size:11.5px;color:var(--muted)">${doneMs} / ${p.milestones.length}단계 완료</span>
      <span class="more" style="color:var(--blue);font-weight:600">다음 단계 · ${esc((p.milestones.find(m=>!m.done)||{name:'-'}).name)}</span></div>
    <div class="ms"><div class="fill" style="width:${(doneMs-0.5)/p.milestones.length*100}%"></div>
      ${p.milestones.map((m,i)=>`<div class="n ${m.done?'done':''} ${!m.done&&(i===0||p.milestones[i-1].done)?'cur':''}">
        <i></i><b>${esc(m.name)}</b><span>${esc(m.date)}</span></div>`).join('')}</div>
  </div>
  <div class="card pad"><div class="ch"><h3>산출물 · 문서</h3><span class="pill">${p.deliverables.length}개</span>
    <span class="more" style="cursor:pointer" onclick="toast('파일 업로드는 2차 기능입니다 — 지금은 드라이브 링크로 관리합니다')">파일 업로드</span></div>
    ${p.deliverables.length?p.deliverables.map(d=>`<div class="file"><span class="ic"></span>
      <b style="font-weight:600">${esc(d.name)}</b><span class="k">${esc(d.kind)}</span>
      <span class="who">${av(d.by,20)}${esc(M[d.by].name)}</span>
      <span style="font-size:11.5px;color:var(--muted)">${esc(d.date)}</span>
      <span class="v">${esc(d.ver)}</span><span class="dl">다운로드</span></div>`).join('')
     :`<div class="empty">등록된 산출물이 없습니다.</div>`}

function vTasks(){
  const q=(t)=>`<div class="tr2 ${URG(t)?'urgent':''}" onclick="openTask('${t.id}')">
      <span class="dot" style="background:${URG(t)?'var(--red)':tone(t.status)}"></span>
      <div><b>${urgTag(t)}${esc(t.title)}</b><span>${esc(t.tag)} · ${esc(M[t.a].name)} · ${t.prio}</span></div>
      ${t.comments&&t.comments.length?`<span class="cbadge">💬 ${t.comments.length}</span>`:''}
      ${statusSel(t)}
      <span class="dday ${dday(t.due)<=2?'urg':''}">${ddayTxt(t.due)}</span></div>`;
  const live=LIVE();
  const body=TRACKS().map(tr=>{
    const ps=projOf(tr.id).filter(pr=>live.some(t=>t.p===pr.id));
    if(!ps.length) return '';
    const n=live.filter(t=>TRK(P[t.p].track).id===tr.id).length;
    return `<div class="card pad" style="margin-bottom:16px">
      <div class="ch"><span class="tdot" style="background:${tr.color}"></span>
        <h3>${esc(tr.name)}</h3><span class="pill">${n}건</span></div>
      ${ps.map(pr=>{
        const S={'지연':0,'진행중':1,'검수중':2,'대기':3,'협의중':4};
        const ts=live.filter(t=>t.p===pr.id).slice()
          .sort((a,b)=>(URG(b)-URG(a))||(S[a.status]-S[b.status])||a.due.localeCompare(b.due));
        const open=OPENP[pr.id]!==false;
        return `<div class="acc">
          <div class="ah" onclick="togAcc('${pr.id}')">
            <span class="car ${open?'on':''}">▸</span><b>${esc(pr.name)}</b>
            <span class="pill" style="margin-left:8px">${ts.length}건</span>
            <span style="margin-left:auto;font-size:11px;color:var(--muted)">${esc(pr.next||'').slice(0,34)}</span>
            <button class="btn sec" style="margin-left:10px;padding:5px 11px;font-size:11px"
              onclick="event.stopPropagation();openModal('${pr.id}')">+ 업무</button></div>
          ${open?`<div class="ab">${ts.map(q).join('')}</div>`:''}
        </div>`;}).join('')}
    </div>`;}).join('');
  return `<div class="card pad" style="margin-bottom:16px;display:flex;align-items:center;gap:12px">
      <b style="font-size:13px">관리 대상 업무 ${live.length}건</b>
      <span style="font-size:11.5px;color:var(--muted)">끝난 기록 ${LOGS().length}건은 <a href="#/activity" style="color:var(--blue)">활동 이력</a>으로 내려가 있습니다</span>
      <button class="btn" style="margin-left:auto" onclick="openModal()">+ 업무 등록</button></div>
    ${body||'<div class="empty">관리 대상 업무가 없습니다.</div>'}
    ${DATA.unassigned.length?`<div class="card pad"><div class="ch"><h3>담당자 미지정</h3>
      <span class="pill" style="background:var(--red-soft);color:var(--red)">${DATA.unassigned.length}건</span></div>
      ${DATA.unassigned.map(u=>`<div class="li"><span class="chk"></span>${esc(u.title)}
        <span style="font-size:11px;color:var(--muted);margin-left:8px">${esc(P[u.p].name.slice(0,14))}</span>
        <button class="btn" style="margin-left:auto;padding:6px 13px;font-size:11.5px" onclick="openModal('${u.p}','${esc(u.title)}')">지정</button></div>`).join('')}
    </div>`:''}`;
}

/* 활동 이력 — 끝난 기록. 프로젝트별로 접어서 본다 */
function vActivity(){
  const logs=LOGS().slice().sort((a,b)=>(b.end||'').localeCompare(a.end||''));
  const byDate={};
  logs.forEach(t=>(byDate[t.end]=byDate[t.end]||[]).push(t));
  const days=Object.keys(byDate).sort().reverse();
  return `<div class="card pad" style="margin-bottom:16px;display:flex;align-items:center;gap:12px">
      <b style="font-size:13px">완료 기록 ${logs.length}건</b>
      <span style="font-size:11.5px;color:var(--muted)">각 채팅방 적재분이 여기에 쌓입니다. 관리 대상 업무는 <a href="#/tasks" style="color:var(--blue)">업무관리</a>에 있습니다</span></div>
    ${days.map(dt=>`<div class="card pad" style="margin-bottom:14px">
      <div class="ch"><h3>${dt.slice(5).replace('-','. ')}</h3>
        <span class="pill">${byDate[dt].length}건</span>
        <span style="margin-left:10px;font-size:11.5px;color:var(--muted)">${'일월화수목금토'[new Date(dt+'T00:00:00').getDay()]}요일</span></div>
      ${byDate[dt].map(t=>`<div class="tr2" onclick="openTask('${t.id}')">
        <span class="dot" style="background:${TRK(P[t.p].track).color}"></span>
        <div><b>${esc(t.title)}</b><span>${esc(P[t.p].name.replace(/\s*\(.*?\)/,''))} · ${esc(M[t.a].name)}</span></div>
        ${t.comments&&t.comments.length?`<span class="cbadge">💬 ${t.comments.length}</span>`:''}
        <span style="font-size:11px;color:var(--muted)">${esc(t.tag)}</span></div>`).join('')}
    </div>`).join('')||'<div class="empty">기록이 없습니다.</div>'}`;
}

function vReport(){
  const r=periodRange(), T=periodTasks().concat(periodLogs());
  const pl={day:'일간',week:'최근 7일',month:'월간'}[PERIOD];
  const dayLabel={day:'오늘',week:'최근 7일',month:'이번 달'}[PERIOD];
  const of=id=>T.filter(t=>t.a===id);
  const cnt=id=>of(id).filter(t=>t.status==='완료').length;

  const tabs=`<div class="ptabs">
    <button class="ptab ${RPERSON==='all'?'on':''}" onclick="setRPerson('all')">
      <span class="all"></span>전체 종합<span class="cnt">${T.length}</span></button>
    ${DATA.members.filter(m=>m.kind!=='ai').map(m=>`<button class="ptab ${RPERSON===m.id?'on':''}" onclick="setRPerson('${m.id}')">
      ${av(m.id,22)}${esc(m.name)}<span class="cnt">${of(m.id).length}</span></button>`).join('')}
  </div>`;

  const line=t=>`<div class="pline"><em style="background:${tone(t.status)}"></em>
    <span>${esc(t.title)}</span><span class="p">${esc(P[t.p].name.replace(/\s*\(.*?\)/,'').slice(0,12))}
    ${t.status==='완료'?' · '+(t.end||t.due).slice(5).replace('-','.'):' · '+ddayTxt(t.due)}</span></div>`;

  /* ── 개인 탭 ───────────────────────────────── */
  if(RPERSON!=='all'){
    const m=M[RPERSON], list=of(RPERSON);
    const srt=(a,b)=> a.status==='완료' ? (b.end||'').localeCompare(a.end||'')||a.title.localeCompare(b.title)
                                       : (a.due||'').localeCompare(b.due||'');
    const g=st=>list.filter(t=>st==='대기'?(t.status==='대기'||t.status==='지연'):t.status===st).slice().sort(srt);
    const acts=DATA.activity.filter(a=>a.who===RPERSON);
    return tabs+kpiRow([
      {label:dayLabel+' 완료',value:g('완료').length,unit:'건',pct:100,foot:esc(m.name)+' · '+esc(m.role)},
      {label:'진행중',value:g('진행중').length,unit:'건',pct:60,foot:'작업 중'},
      {label:'검수중',value:g('검수중').length,unit:'건',pct:40,color:'var(--green)',foot:'확인 대기'},
      {label:'대기 · 지연',value:g('대기').length,unit:'건',pct:30,color:'var(--red)',
       foot:list.filter(t=>t.status==='지연').length?'지연 '+list.filter(t=>t.status==='지연').length+'건':'착수 전'}
    ])+`<div class="cols">
      <div class="card pad">
        <div class="ch">${av(RPERSON,30)}<div><h3 style="display:inline">${esc(m.name)}</h3>
          <span style="display:block;font-size:10.5px;color:var(--muted)">${esc(m.role)}${m.kind==='ai'?' · AI 직원':''}</span></div>
          <span class="pill" style="margin-left:auto">${periodRange().label}</span></div>
        ${list.length?['완료','진행중','검수중','대기'].map(st=>{
          const ls=g(st); if(!ls.length) return '';
          return `<div class="psec"><b>${st==='대기'?'대기 · 지연':st} <span style="color:var(--muted);font-weight:400">${ls.length}건</span></b>
            ${ls.map(line).join('')}</div>`;
        }).join(''):`<div class="empty">${dayLabel} 배정된 업무가 없습니다.</div>`}
      </div>
      <div class="dp">
        <div class="ch"><h3>활동 로그</h3><span class="pill" style="margin-left:auto">${acts.length}</span></div>
        ${acts.length?acts.slice(0,12).map(a=>`<div class="act" style="color:#dbe2ec">
          <em style="background:${m.color}"></em>${esc(a.text.length>26?a.text.slice(0,26)+'…':a.text)}
          <span class="t" style="color:var(--dark-panel-sub)">${esc(a.when)}</span></div>`).join('')
          :`<div style="font-size:12px;color:var(--dark-panel-sub);padding:12px 0">기록된 활동이 없습니다.</div>`}
        <hr>
        <div style="font-size:12.5px;font-weight:600;margin-bottom:10px">참여 프로젝트</div>
        ${[...new Set(list.map(t=>t.p))].map(pid=>`<div class="act" style="color:#dbe2ec">
          <em style="background:${tone(P[pid].status)}"></em>${esc(P[pid].name.slice(0,18))}
          <span class="t" style="color:#fff;font-weight:700">${of(RPERSON).filter(t=>t.p===pid).length}건</span></div>`).join('')
          ||'<div style="font-size:12px;color:var(--dark-panel-sub)">—</div>'}
      </div></div>`;
  }

  /* ── 전체 종합 탭 ───────────────────────────── */
  const done=T.filter(t=>t.status==='완료'), run=T.filter(t=>t.status==='진행중');
  const late=T.filter(t=>t.status==='지연');
  const urgent=T.filter(t=>t.status!=='완료'&&dday(t.due)<=3);
  return tabs+kpiRow([
    {label:dayLabel+' 완료',value:done.length,unit:'건',pct:100,foot:'담당자 '+DATA.members.length+'명 합계'},
    {label:'진행중',value:run.length,unit:'건',pct:70,foot:'작업 중'},
    {label:'지연',value:late.length,unit:'건',pct:20,color:'var(--red)',foot:late.length?'즉시 조치':'없음'},
    {label:'담당자 미지정',value:DATA.unassigned.length,unit:'건',pct:35,color:'var(--amber)',foot:'배정 대기'}
  ])+`<div class="cols">
    <div class="card pad">
      <div class="ch"><h3>${pl} 요약 보고서</h3>
        <span style="font-size:11.5px;color:var(--muted)">${periodRange().label}</span>
        <span class="more" style="color:var(--blue);font-weight:600;cursor:pointer"
          onclick="toast('인쇄 대화상자에서 PDF로 저장하세요');window.print()">PDF 내보내기</span></div>
      ${DATA.members.filter(m=>m.kind!=='ai'&&of(m.id).length).map(m=>{
        const srt2=(a,b)=>(b.end||'').localeCompare(a.end||'');
        const l=of(m.id), d=l.filter(t=>t.status==='완료').slice().sort(srt2),
              o=l.filter(t=>t.status!=='완료').slice().sort((a,b)=>(a.due||'').localeCompare(b.due||''));
        return `<div class="pcard"><div class="ph2">${av(m.id,26)}
          <div><b>${esc(m.name)}</b> <small>${esc(m.role)}${m.kind==='ai'?' · AI':''}</small></div>
          <span class="st">완료 <b style="color:var(--txt)">${d.length}</b> · 남음 ${o.length}</span></div>
          ${d.length?`<div class="psec"><b>한 것</b>${d.map(line).join('')}</div>`:''}
          ${o.length?`<div class="psec" style="margin-bottom:0"><b>남은 것</b>${o.slice(0,5).map(line).join('')}
            ${o.length>5?`<div class="pline" style="color:var(--muted)"><em style="background:var(--muted)"></em>외 ${o.length-5}건 — <span style="color:var(--blue);cursor:pointer" onclick="setRPerson('${m.id}')">${esc(m.name)} 탭에서 전체보기</span></div>`:''}</div>`:''}
        </div>`;}).join('')||'<div class="empty">이 기간에 기록된 업무가 없습니다.</div>'}
      <div style="margin-top:6px;padding:13px 15px;background:var(--blue-soft);border-radius:12px;font-size:11.5px;color:var(--blue);line-height:1.6">
        이 보고서는 <b>board.json</b>에서 자동 생성됩니다. 각 채팅방이 적재함에 한 줄씩 남기면
        매일 밤 자동으로 반영되고 이 화면이 그대로 바뀝니다.</div>
    </div>
    <div class="dp">
      <div class="ch"><h3>대표 조치 필요</h3>
        <span class="pill" style="margin-left:auto;background:var(--red);color:#fff">${urgent.length+DATA.unassigned.length}</span></div>
      ${urgent.length?`<div style="font-size:11px;color:var(--dark-panel-sub);margin-bottom:10px">기한 3일 이내</div>
        ${urgent.map(t=>`<div class="uz"><div><b>${esc(t.title.length>24?t.title.slice(0,24)+'…':t.title)}</b>
          <span>${esc(M[t.a].name)} · ${esc(P[t.p].name.slice(0,14))}</span></div>
          <span style="margin-left:auto;font-weight:700;color:${dday(t.due)<=1?'#ff5a5a':'#fff'}">${ddayTxt(t.due)}</span></div>`).join('')}`:''}
      ${DATA.unassigned.length?`<hr><div style="font-size:11px;color:var(--dark-panel-sub);margin-bottom:10px">담당자 미지정</div>
        ${DATA.unassigned.map(u=>`<div class="uz"><div><b>${esc(u.title.length>24?u.title.slice(0,24)+'…':u.title)}</b>
          <span>${esc(P[u.p].name.slice(0,16))}</span></div>
          <button onclick="openModal('${u.p}','${esc(u.title)}')">지정</button></div>`).join('')}`:''}
      ${!urgent.length&&!DATA.unassigned.length?'<div style="font-size:12px;color:var(--dark-panel-sub);padding:12px 0">조치할 항목이 없습니다.</div>':''}
    </div>
  </div>`;
}

function hideToast(){ const el=document.getElementById('toast'); if(el) el.classList.remove('on'); clearTimeout(window._tt); }

  const el=document.getElementById('toast'); if(!el) return;
  el.innerHTML=`<span class="tmsg"></span><span class="tx" onclick="hideToast()" title="닫기">✕</span>
                <i class="tbar" style="width:100%"></i>`;

  const bar=el.querySelector('.tbar');
  requestAnimationFrame(()=>{ bar.style.transition=`width ${ms}ms linear`; bar.style.width='0%'; });
